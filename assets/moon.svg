<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <linearGradient id="moonGradient" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="moonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Crescent Moon -->
  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" fill="url(#moonGradient)" filter="url(#moonGlow)" />
  <!-- Crescent Inner Light Arc -->
  <path d="M19 12.5A7.5 7.5 0 0 1 11.5 5a6.2 6.2 0 0 0 0 1.5 7.5 7.5 0 0 0 7.5 7.5c0-.5 0-1 0-1.5z" fill="#93C5FD" opacity="0.35" />
  <!-- Sparkle Accent Star -->
  <path d="M18.5 4.5l.5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5.5-1.5z" fill="#BAE6FD" />
</svg>

